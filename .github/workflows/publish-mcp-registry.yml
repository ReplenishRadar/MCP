name: Publish to official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: publish-mcp-registry
    steps:
      # The Registry record names npm versions: publish only from main, and only once npm has every one.
      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Run this from main, not $GITHUB_REF."; exit 1; }

      - uses: actions/checkout@v4

      - name: Require every npm version server.json names
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const pkgs = require("./server.json").packages.filter((p) => p.registryType === "npm");
            if (!pkgs.length) throw new Error("server.json names no npm package");
            for (const p of pkgs) {
              const got = execFileSync("npm", ["view", `${p.identifier}@${p.version}`, "version"], { encoding: "utf8" }).trim();
              if (got !== p.version) throw new Error(`${p.identifier}@${p.version} is not on npm yet; publish it first.`);
            }
          '

      - name: Install pinned MCP publisher
        env:
          PUBLISHER_VERSION: v1.8.0
          PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate Registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Registry version
        run: ./mcp-publisher publish
